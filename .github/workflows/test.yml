name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest jinja2 aiohttp pyflakes
      - run: python -m pyflakes *.py
      - run: python -m pytest -q tests
